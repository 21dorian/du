<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f5f7">
<title>Entrevo Pro</title>
<style>
:root{--ink:#1d1d1f;--muted:#6e6e73;--bg:#f5f5f7;--line:#d2d2d7;--blue:#0071e3}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;display:flex;align-items:center;justify-content:center;padding:calc(24px + env(safe-area-inset-top)) 20px 24px}
main{width:100%;max-width:420px}
.logo{width:56px;height:56px;border-radius:14px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:22px;margin-bottom:18px}
h1{font-size:28px;line-height:1.15;margin:0 0 6px}
p{color:var(--muted);margin:0 0 22px}
label{display:block;font-size:14px;font-weight:600;margin:0 0 6px}
input{width:100%;font:inherit;font-size:17px;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
input:focus-visible,button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.choices{display:grid;gap:10px;margin:18px 0 0}
button{font:inherit;font-weight:600;border:0;border-radius:14px;padding:16px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:2px}
button small{font-weight:400;color:var(--muted)}
.primary{background:var(--ink);color:#fff}.primary small{color:#c7c7cc}
.light{background:#fff;color:var(--ink);border:1px solid var(--line)}
.err{color:#d70015;font-size:14px;min-height:20px;margin:8px 0 0}
.foot{font-size:13px;margin-top:24px;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<main>
  <div class="logo" aria-hidden="true">E</div>
  <h1>Entrevo Pro</h1>
  <p>Tes ventes en direct, la vente rapide et le contrôle des entrées, sur ton téléphone.</p>
  <form id="f" novalidate>
    <label for="site">Adresse de ta billetterie</label>
    <input id="site" type="url" inputmode="url" autocomplete="url" autocapitalize="none" spellcheck="false" placeholder="https://billetterie.mon-asso.fr" required>
    <div class="err" id="err" role="alert"></div>
    <div class="choices">
      <button class="primary" type="submit" data-path="/pro/app">Organisateur<small>Ventes en direct, alertes, vente rapide, messages</small></button>
      <button class="light" type="submit" data-path="/scan">Contrôle des entrées<small>QR codes, bracelets NFC, liste des invités</small></button>
    </div>
  </form>
  <div class="foot">Version <span id="v">4.3.0</span></div>
</main>
<script>
(function () {
  var f = document.getElementById('f'), site = document.getElementById('site'), err = document.getElementById('err'), path = '/pro/app';
  var get = function (k) { try { return localStorage.getItem('pro:' + k); } catch (e) { return null; } }, set = function (k, v) { try { localStorage.setItem('pro:' + k, v); } catch (e) {} };
  var saved = get('site'); if (saved) site.value = saved;
  var setup = /[?&]reglages\b/.test(location.search);
  function go(base, p) {
    if (window.EntrevoNative && window.EntrevoNative.setSite) try { window.EntrevoNative.setSite(base); } catch (e) {}
    location.href = base + p;
  }
  if (saved && get('path') && !setup) { go(saved, get('path')); return; }
  Array.prototype.forEach.call(f.querySelectorAll('button'), function (b) { b.addEventListener('click', function () { path = b.dataset.path; }); });
  f.addEventListener('submit', function (e) {
    e.preventDefault(); err.textContent = '';
    var v = site.value.trim().replace(/\/+$/, '');
    if (!/^https?:\/\//i.test(v)) v = 'https://' + v;
    var u; try { u = new URL(v); } catch (x) { err.textContent = 'Cette adresse ne ressemble pas à un site.'; return; }
    if (u.protocol !== 'https:' && !/^(localhost|127\.|10\.|192\.168\.)/.test(u.hostname)) { err.textContent = 'L’adresse doit commencer par https://'; return; }
    var base = u.origin + u.pathname.replace(/\/+$/, '');
    err.textContent = 'Connexion…';
    fetch(base + '/sante', { cache: 'no-store' }).then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function () { set('site', base); set('path', path); go(base, path); })
      .catch(function () { err.textContent = 'Impossible de joindre ' + u.host + ' : vérifie l’adresse et ta connexion.'; });
  });
})();
</script>
</body>
</html>
